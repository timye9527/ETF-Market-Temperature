# ETF Market Temperature — V1 ETF Universe (v0.1, 2026-10-06)
#
# 结构：families（经济暴露的身份） + etfs（具体工具）。
# 单一事实来源：ETF 的 asset_class / region / sector / industry 不在 ETF 上重复填写，
# 而是由 etf.family → family.node → taxonomy.yaml 的路径推导（见 docs/family-model.md §2）。
#
# ⚠️ 数据完整性声明（必须读）：
#   本文件所有 benchmark / leverage / issuer 信息来自研究员知识整理，尚未逐只对照基金官网 fact sheet 核验。
#   因此每只 ETF 的 verified 都是 false。Phase 1b 的第一项工作就是逐只核验并把 verified 改为 true、
#   填写 source_url 与 verified_on。verified: false 的 Leveraged / Inverse ETF 不得进入 Bull/Bear 因子计算。
#   AUM / 成交额 / expense_ratio / inception_date 是会变化的数字，不手填，由数据管道写入 data/metadata/（见 docs/data-requirements.md）。
#
# 字段：
#   family.identity_basis: INDEX（同一指数） | SPOT_ASSET（实物/现货同一资产，如 GLD/IAU）
#                          | FUTURES_STRATEGY（期货滚动策略，每只基金规则不同 → 各自成 Family） | ACTIVE（主动管理）
#   etf.role:      CORE | ALTERNATIVE_CORE | LEVERAGED_BULL | LEVERAGED_BEAR | INVERSE | SATELLITE | THEMATIC | PROXY
#   etf.direction: LONG | SHORT
#   etf.leverage:  每日杠杆目标的绝对值（1, 1.5, 2, 3）；方向由 direction 表示
#   etf.tier:      V1 研究员判断，仅作参考。V2 起是否参与计算由流动性 Top 20 规则决定（framework-v2 §5），bucket 由 node + role 推导
#   family.sentiment_only: 该 Family 只有杠杆/反向成员（期货指数与现货 Family 不同），价格因子取 price_proxy_family（同节点）
#   etf.exchange:  留空，由数据源填写，避免手填出错

