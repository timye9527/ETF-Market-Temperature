<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETF 市场温度计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
</head>
<body>
<!--APP-START-->
<style>
/* Layout: weather-station bulletin — a ruled board of instrument readings, summary first, detail on demand. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eaeef2;
  --ink: #11161d; --ink-2: #47505d; --ink-3: #737d8b; --line: #d9dfe6;
  --accent: #1d4f91; --focus: #1d4f91;
  --t0: #1c5cab; --t1: #2a78d6; --t2: #86b6ef; --t3: #c6c7c1; --t4: #f0a088; --t5: #e34948; --t6: #a51f1f;
  --demo-bg: #fff4d6; --demo-ink: #6b4a00; --demo-line: #ecc766;
  --good: #0c7d0c; --bad: #c43535;
  --f-display: "Barlow Condensed", "Arial Narrow", "Noto Sans SC", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1114; --surface: #161a1f; --surface-2: #1e242b;
  --ink: #edf0f3; --ink-2: #b3bbc6; --ink-3: #848e9b; --line: #2b323a;
  --accent: #8db3ea; --focus: #8db3ea;
  --t0: #4b8ae0; --t1: #3987e5; --t2: #6d9cd6; --t3: #4b4b47; --t4: #d98269; --t5: #e66767; --t6: #f28b80;
  --demo-bg: #2e2510; --demo-ink: #f3d68a; --demo-line: #6b5520;
  --good: #4cc44c; --bad: #ef7a7a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1114; --surface: #161a1f; --surface-2: #1e242b;
  --ink: #edf0f3; --ink-2: #b3bbc6; --ink-3: #848e9b; --line: #2b323a;
  --accent: #8db3ea; --focus: #8db3ea;
  --t0: #4b8ae0; --t1: #3987e5; --t2: #6d9cd6; --t3: #4b4b47; --t4: #d98269; --t5: #e66767; --t6: #f28b80;
  --demo-bg: #2e2510; --demo-ink: #f3d68a; --demo-line: #6b5520;
  --good: #4cc44c; --bad: #ef7a7a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--f-body); margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--ink-3); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font: 700 22px/1 var(--f-display); letter-spacing: .02em; }
.brand span { font: 500 12px var(--f-mono); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { border: 0; background: none; padding: 6px 12px; border-radius: var(--r); cursor: pointer; color: var(--ink-2); }
nav button[aria-current="true"] { background: var(--surface-2); color: var(--ink); font-weight: 500; }
nav button:hover { color: var(--ink); }
.asof { font: 12px var(--f-mono); color: var(--ink-3); }

.demo { margin-top: 16px; border: 1px solid var(--demo-line); background: var(--demo-bg); color: var(--demo-ink); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
.demo b { font-weight: 700; }

/* section headings */
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.sec { margin-top: 28px; display: grid; gap: 12px; }
.sec-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.sec-h h2 { font: 600 20px/1.2 var(--f-display); letter-spacing: .02em; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.reading { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.big { font: 700 84px/0.85 var(--f-display); letter-spacing: -.01em; }
.big sup { font-size: .38em; vertical-align: top; position: relative; top: .25em; margin-left: 2px; color: var(--ink-3); }
.reading-meta { display: grid; gap: 4px; padding-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--c, var(--t3)); }
.delta.up { color: var(--bad); } .delta.down { color: var(--t1); }
.delta { font: 500 12px var(--f-mono); }
.hero-spark svg { display: block; width: 100%; height: 56px; margin-top: 12px; }
.hero-note { color: var(--ink-2); font-size: 13px; margin-top: 10px; max-width: 60ch; }

.gauge-row { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; margin-top: 12px; }
.gauge-row .lbl { font-size: 12px; color: var(--ink-2); }
.minibar { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; }
.minibar b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ink-3); }
.signal-tag { font: 500 11px var(--f-mono); letter-spacing: .08em; color: var(--accent); border: 1px solid var(--accent); padding: 1px 6px; border-radius: 3px; }

/* board */
.board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 0; min-width: 0; }
.group h3 { font: 600 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); padding: 8px 16px 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(70px, 1fr) 48px 52px 74px; align-items: center; gap: 10px; padding: 7px 16px; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; border-top: 1px solid var(--line); }
.row:hover { background: var(--surface-2); }
.row .nm { min-width: 0; }
.row .nm b { display: block; font-weight: 500; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .nm span { display: block; font: 11px var(--f-mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t { font: 700 26px/1 var(--f-display); text-align: right; }
.row .t.na { font: 500 12px var(--f-body); color: var(--ink-3); }
.row .delta { text-align: right; }
.row svg { display: block; width: 100%; height: 26px; }
.row.disabled { cursor: default; } .row.disabled:hover { background: none; }

/* thermometer track */
.track { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--t0) 0 15%, var(--t1) 15% 35%, var(--t2) 35% 45%, var(--t3) 45% 55%, var(--t4) 55% 65%, var(--t5) 65% 85%, var(--t6) 85% 100%); opacity: .9; }
.track .mk { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.track.empty { background: var(--surface-2); }

/* rotation */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 12px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.chart-box { overflow-x: auto; }
.chart-box svg text { fill: var(--ink-2); font: 11px var(--f-body); }
.chart-box svg .ax { stroke: var(--line); }
.heat { display: grid; gap: 2px; min-width: 640px; }
.heat .hr { display: grid; grid-template-columns: 120px repeat(var(--cols), minmax(0, 1fr)) 40px; gap: 1px; align-items: center; }
.heat .hl { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; border: 0; background: none; text-align: left; cursor: pointer; }
.heat .hc { height: 18px; }
.heat .hv { font: 700 15px var(--f-display); text-align: right; }
.heat .hx { font: 10.5px var(--f-mono); color: var(--ink-3); }
.rbar { display: grid; grid-template-columns: 70px minmax(0, 1fr) 64px 56px 64px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.rbar .z { position: relative; height: 14px; }
.rbar .z::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.rbar .z b { position: absolute; top: 2px; height: 10px; border-radius: 2px; }
.chip.trend { background: var(--surface-2); font-family: var(--f-mono); font-size: 11.5px; }
.chip.cls { background: transparent; border: 1px solid var(--line); }
.conf { font-size: 12px; font-weight: 700; color: var(--bad); white-space: nowrap; }
.conf-t { font-style: normal; color: var(--bad); font-weight: 500; }
.row .nm span { font-family: var(--f-body); font-size: 11.5px; }
.chart-box svg text.ql { fill: var(--ink-3); font: 600 12px var(--f-body); letter-spacing: .08em; }
.chart-box svg text.qn { fill: var(--ink-2); font-size: 11px; }
.panel.action { border-left: 0; }
.act-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 6px 0 10px; }
.act { font: 700 30px/1 var(--f-display); letter-spacing: .02em; }
tr.cur td { background: var(--surface-2); font-weight: 700; }
.ck { display: grid; gap: 0; }
.ck-i { display: grid; grid-template-columns: minmax(0, 1.6fr) 70px 90px 90px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.ck-i:first-child { border-top: 0; }
.ck-i .hot { color: var(--bad); font-weight: 700; } .ck-i .cold { color: var(--t1); font-weight: 700; }
.stocks { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.stk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 10px; font-size: 12.5px; }
.stk .up { color: var(--bad); } .stk .down { color: var(--t1); }
.seg.wrap { flex-wrap: wrap; display: flex; }
tr.dimrow td { color: var(--ink-3); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; text-align: left; }
.research-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .research-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .ck-i { grid-template-columns: minmax(0, 1fr) 54px 70px; } .ck-i > :last-child { display: none; } }
.chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.chain .lnk { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 12px; min-width: 120px; cursor: pointer; text-align: left; }
.chain .arrow { align-self: center; color: var(--ink-3); font-family: var(--f-mono); }
.chain .lnk b { font: 700 24px/1 var(--f-display); }

/* tree */
.tree { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 0; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 110px 44px 52px; gap: 10px; align-items: center; padding: 5px 16px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.trow:hover { background: var(--surface-2); }
.trow .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.dim .nm { color: var(--ink-3); font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.trow .t { font: 700 18px/1 var(--f-display); text-align: right; }

/* detail */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; color: var(--ink-3); margin-top: 20px; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.detail-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; margin-top: 8px; }
.detail-head h1 { font: 700 40px/1.05 var(--f-display); letter-spacing: .01em; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.factor { display: grid; grid-template-columns: 160px minmax(0, 1fr) 40px; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.factor:first-of-type { border-top: 0; }
.factor .fn b { display: block; font-weight: 500; }
.factor .fn span { font-size: 11px; color: var(--ink-3); }
.factor .v { font: 700 22px/1 var(--f-display); text-align: right; }
.factor .sub { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-3); }
.factor .sub em { font-style: normal; color: var(--ink-2); font-family: var(--f-mono); }
.factor.na .v { font: 500 12px var(--f-body); color: var(--ink-3); }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; }
.bar b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); opacity: .5; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.r, th.r { text-align: right; }
tr.fam td { background: var(--surface-2); font-weight: 500; white-space: normal; }
.role { font: 500 10.5px var(--f-mono); letter-spacing: .04em; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); }
.ok { color: var(--good); } .warn { color: var(--bad); }

.hist-ctl { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.histsvg { width: 100%; height: 240px; display: block; }
.histsvg text { fill: var(--ink-3); font: 10.5px var(--f-mono); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); white-space: nowrap; z-index: 9; }
.rel { position: relative; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.prose { max-width: 70ch; color: var(--ink-2); display: grid; gap: 10px; }
.prose h3 { color: var(--ink); font: 600 17px var(--f-display); letter-spacing: .03em; margin-top: 8px; }
.prose code { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.foot { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 12px; color: var(--ink-3); display: grid; gap: 4px; }

@media (max-width: 860px) {
  .hero, .board, .two { grid-template-columns: minmax(0, 1fr); }
  .big { font-size: 68px; }
}
@media (max-width: 520px) {
  .row { grid-template-columns: minmax(0, 1fr) 44px 48px; }
  .row .trk, .row .spark { display: none; }
  .trow { grid-template-columns: minmax(0, 1fr) 40px 48px; }
  .trow .trk { display: none; }
  .factor { grid-template-columns: 96px minmax(0, 1fr) 36px; }
  .detail-head { grid-template-columns: minmax(0, 1fr); }
  .detail-head h1 { font-size: 32px; }
}
@media (prefers-reduced-motion: no-preference) { .track .mk { transition: left .4s ease; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>ETF 市场温度计</b><span>Market Temperature</span></div>
    <nav id="nav" aria-label="页面">
      <button data-view="overview">总览</button>
      <button data-view="rotation">资金轮动</button>
      <button data-view="tree">市场树</button>
      <button data-view="pool">ETF 池</button>
      <button data-view="research">研究</button>
      <button data-view="method">方法</button>
    </nav>
    <span class="asof" id="asof"></span>
  </div>
</header>

<main class="wrap" id="app"></main>

<script src="data.js"></script>
<script>
(() => {
const D = window.ETF_TEMP;
const app = document.getElementById("app");
if (!D) { app.innerHTML = '<p class="demo">没有找到数据文件 data.js。请先运行 <code>python3 -m etf_temperature.build</code>。</p>'; return; }
const V2 = D.meta.version === "v2";
const N = D.nodes, E = D.etfs, F = D.families, S = D.stocks || {};
const BAND = { EXTREME_COLD: ["极冷", "Extreme Cold", 0], COLD: ["冷", "Cold", 1], COOL: ["偏冷", "Cool", 2],
  NEUTRAL: ["中性", "Neutral", 3], WARM: ["偏暖", "Warm", 4], HOT: ["热", "Hot", 5], EXTREME_HOT: ["极热", "Extreme Hot", 6] };
const FACT = V2 ? [
  ["stretch", "偏离趋势", "离自己的 6 个月与 1 年趋势线多远（回归偏离）· 周线 RSI"],
  ["accel", "动量加速", "20/60 日涨跌减去趋势应有的涨幅"],
  ["crowding", "拥挤度", "带方向的成交额 · 杠杆多空"],
  ["breadth", "广度", "子板块 ETF 与所属大市值股站上 50 日线、创新高/新低"],
  ["rs", "相对强弱偏离", "相对上级板块的比价，同样看偏离趋势"],
] : [["trend", "趋势", ""], ["volume", "成交", ""], ["bullbear", "多空杠杆", ""], ["rs", "相对强弱", ""], ["breadth", "广度", ""]];
const ROLE = { CORE: "核心", ALTERNATIVE_CORE: "替代核心", LEVERAGED_BULL: "杠杆多", LEVERAGED_BEAR: "杠杆空", INVERSE: "反向", THEMATIC: "主题", SATELLITE: "卫星", PROXY: "代理" };
const TREND = { STRONG_UP: ["强上升", "↑↑"], UP: ["上升", "↑"], FLAT: ["震荡", "→"], DOWN: ["下降", "↓"], STRONG_DOWN: ["强下降", "↓↓"] };
const CLS = D.meta.classes || {};
const ACT = D.meta.actions || {};
const BUCKET = { US_BROAD: "美股宽基与风格", US_SECTOR: "美股行业（GICS）", US_INDUSTRY: "美股细分行业", THEME: "主题",
  LEVERAGED_INDEX: "指数/行业杠杆与反向", LEVERAGED_SINGLE_STOCK: "单股杠杆与反向", BOND: "债券", COMMODITY: "商品与贵金属",
  INTERNATIONAL: "国际（美股上市）", CRYPTO: "加密", REFERENCE: "参照" };
const REASON = { TOP_N: "Top " + (D.meta.top_n || 20), COVERAGE: "覆盖节点", PAIR: "配对补全", LEVERAGE_BLOCK: "杠杆块", ALT_CORE: "替代核心" };
const ZH = {
  "EQUITY": "全球股票", "EQUITY/GLOBAL": "全球股票 ACWI", "EQUITY/US": "美股", "EQUITY/US/BROAD/SP500": "标普 500",
  "EQUITY/US/BROAD/NASDAQ100": "纳斯达克 100", "EQUITY/US/BROAD/SMALL_CAP": "美国小盘", "EQUITY/US/BROAD/DOW": "道琼斯",
  "EQUITY/US/BROAD/TOTAL_MARKET": "美国全市场", "EQUITY/US/SECTOR/INFORMATION_TECHNOLOGY": "科技",
  "EQUITY/US/SECTOR/INFORMATION_TECHNOLOGY/SEMICONDUCTORS": "半导体", "EQUITY/US/SECTOR/INFORMATION_TECHNOLOGY/SEMICONDUCTORS/MEMORY": "存储 Memory",

const fmt = (v, d = 0) => v == null ? "—" : Number(v).toFixed(d);
const sgn = (v, d = 0) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d);
const bandOf = v => { if (v == null) return null; for (const b of D.meta.bands) if (v < b.max) return b.code; return "EXTREME_HOT"; };
const deltaCls = v => v == null || Math.abs(v) < 0.5 ? "" : v > 0 ? "up" : "down";
const chip = b => b ? `<span class="chip" style="--c:${tcol(b)}"><i></i>${BAND[b][0]}</span>` : `<span class="chip">无读数</span>`;

const clsChip = n => n.eligibility ? `<span class="chip cls" title="${n.eligibility.reviewed ? "已人工复核" : "自动建议，待复核"}">${esc(CLS[n.eligibility.final_class] || n.eligibility.final_class)}${n.eligibility.reviewed ? "" : "*"}</span>` : "";
const confMark = n => n.checklist?.confirmed ? `<span class="conf" title="确认清单满足 ≥3 条且持续 3 日">● 确认${n.checklist.confirmed === "HOT" ? "过热" : "过冷"}</span>` : "";

function spark(vals, w = 90, h = 26) {
  const v = vals.map((x, i) => [i, x]).filter(p => p[1] != null);
  if (v.length < 2) return "";
  const n = vals.length - 1, x = i => i / n * (w - 4) + 2, y = t => h - 3 - t / 100 * (h - 6);
  const d = v.map((p, k) => (k ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
  const last = v[v.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${y(50)}" y2="${y(50)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="2.6" fill="${tcol(bandOf(last[1]))}" stroke="var(--surface)" stroke-width="1"/></svg>`;
}

function quadrant(ids) {
  const pts = ids.map(id => [id, N[id]]).filter(([, n]) => n?.temp != null && n.trend?.ann != null);
  const W = 720, H = 360, l = 44, r = 16, t = 16, b = 34, iw = W - l - r, ih = H - t - b, X = 60;
  const x = v => l + (Math.max(-X, Math.min(X, v)) + X) / (2 * X) * iw, y = v => t + (1 - v / 100) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;height:auto" role="img" aria-label="趋势与温度四象限">`;
  s += `<rect x="${x(0)}" y="${y(100)}" width="${x(X) - x(0)}" height="${y(80) - y(100)}" fill="var(--t5)" opacity=".08"/>
        <rect x="${x(-X)}" y="${y(20)}" width="${x(0) - x(-X)}" height="${y(0) - y(20)}" fill="var(--t1)" opacity=".08"/>`;
  for (const g of [0, 20, 50, 80, 100]) s += `<line x1="${l}" x2="${W - r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${l - 6}" y="${y(g) + 3}" text-anchor="end">${g}°</text>`;
  for (const g of [-60, -30, 0, 30, 60]) s += `<line x1="${x(g)}" x2="${x(g)}" y1="${t}" y2="${t + ih}" stroke="var(--line)" ${g === 0 ? "" : 'stroke-dasharray="2 3"'}/><text x="${x(g)}" y="${H - 14}" text-anchor="middle">${g > 0 ? "+" : ""}${g}%</text>`;
  s += `<text x="${W - r}" y="${H - 2}" text-anchor="end">1 年趋势（年化）→</text>
        <text x="${x(X) - 6}" y="${y(100) + 14}" text-anchor="end" class="ql">过热</text><text x="${x(X) - 6}" y="${y(50) - 6}" text-anchor="end" class="ql">健康上涨</text>
        <text x="${x(-X) + 6}" y="${y(0) - 8}" class="ql">超卖</text><text x="${x(-X) + 6}" y="${y(50) - 6}" class="ql">阴跌</text>`;
  // Label only the readings that matter (extremes, strong trends); the rest stay on hover.
  const placed = [];
  const notable = n => n.temp >= 80 || n.temp <= 20 || Math.abs(n.trend.ann) >= 30 || n.checklist?.confirmed;
  for (const [id, n] of pts) {
    const cx = x(n.trend.ann), cy = y(n.temp), right = cx > W - 140;
    let label = "";
    if (notable(n) && !placed.some(([px, py]) => Math.abs(px - cx) < 70 && Math.abs(py - cy) < 13)) {
      placed.push([cx, cy]);
      label = `<text x="${right ? cx - 9 : cx + 9}" y="${cy + 4}" text-anchor="${right ? "end" : "start"}" class="qn">${esc(zh(id))}</text>`;
    }
    s += `<g data-node="${esc(id)}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="6" fill="${tcol(n.band)}" stroke="var(--surface)" stroke-width="2"/>
      ${label}<title>${esc(zh(id))}：温度 ${fmt(n.temp)}°，趋势 ${sgn(n.trend.ann, 1)}%</title></g>`;
  }
  return s + "</svg>";
}

function rotation() {
  const key = rotK === 5 ? "d5" : "d20";
  const rows = Object.entries(N).filter(([, n]) => n.temp != null && n.mode === "DIRECTIONAL" && n[key] != null).sort((a, b) => b[1][key] - a[1][key]);
  const W = 760, rh = 22, top = 26, L = 170, R = W - 20, H = top + rows.length * rh + 10;
  const x = v => L + v / 100 * (R - L);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:600px;height:auto" role="img" aria-label="各节点 ${rotK} 日温度变化">`;
  for (const t of [0, 25, 50, 75, 100]) svg += `<line class="ax" x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${H - 6}"/><text x="${x(t)}" y="${top - 10}" text-anchor="middle">${t}</text>`;
  rows.forEach(([id, n], i) => {
    const y = top + i * rh + rh / 2, from = n.temp - n[key], to = n.temp;
    svg += `<g data-node="${esc(id)}" style="cursor:pointer"><rect x="0" y="${y - rh / 2}" width="${W}" height="${rh}" fill="transparent"/>
      <text x="${L - 10}" y="${y + 4}" text-anchor="end">${esc(zh(id))}</text>
      <line x1="${x(from)}" x2="${x(to)}" y1="${y}" y2="${y}" stroke="var(--ink-3)" stroke-width="2"/>
      <circle cx="${x(from)}" cy="${y}" r="3.5" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.5"/>
      <circle cx="${x(to)}" cy="${y}" r="5" fill="${tcol(n.band)}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${Math.max(x(from), x(to)) + 10}" y="${y + 4}" style="font-family:var(--f-mono)">${sgn(n[key])}</text>
      <title>${esc(zh(id))}: ${fmt(from)} → ${fmt(to)}</title></g>`;

function histChart(id) {
  const n = N[id], src = histMode === "short" && n.hist_short ? n.hist_short : n.hist;
  const vals = src.slice(-histRange), dates = D.dates.slice(-histRange);
  const W = 640, H = 240, l = 30, r = 10, t = 10, b = 24, iw = W - l - r, ih = H - t - b;
  const x = i => l + i / (vals.length - 1) * iw, y = v => t + (1 - v / 100) * ih;
  let s = `<svg class="histsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(zh(id))} 温度历史">`;
  const edges = [0, ...D.meta.bands.map(b => Math.min(b.max, 100))];
  D.meta.bands.forEach((bd, i) => s += `<rect x="${l}" width="${iw}" y="${y(edges[i + 1])}" height="${y(edges[i]) - y(edges[i + 1])}" fill="var(--t${i})" opacity=".09"/>`);
  for (const g of edges) s += `<line x1="${l}" x2="${W - r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${l - 6}" y="${y(g) + 3}" text-anchor="end">${g}</text>`;
  for (let k = 0; k <= 4; k++) { const i = Math.round(k / 4 * (vals.length - 1)); s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === 4 ? "end" : "middle"}">${dates[i].slice(2)}</text>`; }
  let d = "", pen = false;
  vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
  s += `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  const li = vals.length - 1;
  if (vals[li] != null) s += `<circle cx="${x(li)}" cy="${y(vals[li])}" r="4" fill="${tcol(bandOf(vals[li]))}" stroke="var(--surface)" stroke-width="2"/>`;
  s += `<line id="hx" x1="0" x2="0" y1="${t}" y2="${t + ih}" stroke="var(--ink-3)" stroke-dasharray="3 3" visibility="hidden"/><rect x="${l}" y="${t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  return { svg: s, vals, dates, l, iw, W };
}
function attachHist(h) {
  const box = document.getElementById("histbox"); if (!box) return;
  const svg = box.querySelector("svg"), tip = document.getElementById("htip"), hx = svg.querySelector("#hx");
  svg.addEventListener("pointermove", ev => {
    const rect = svg.getBoundingClientRect(), px = (ev.clientX - rect.left) / rect.width * h.W;
    const i = Math.max(0, Math.min(h.vals.length - 1, Math.round((px - h.l) / h.iw * (h.vals.length - 1))));
    const v = h.vals[i]; if (v == null) { tip.hidden = true; return; }
    const sx = h.l + i / (h.vals.length - 1) * h.iw;
    hx.setAttribute("x1", sx); hx.setAttribute("x2", sx); hx.setAttribute("visibility", "visible");
    tip.hidden = false; tip.innerHTML = `<span class="mono">${h.dates[i]}</span><br><b class="num">${fmt(v)}°</b> ${BAND[bandOf(v)][0]}`;
    tip.style.left = Math.min(rect.width - 110, Math.max(0, sx / h.W * rect.width + 10)) + "px"; tip.style.top = "8px";
  });
  svg.addEventListener("pointerleave", () => { tip.hidden = true; hx.setAttribute("visibility", "hidden"); });
}

const dv = v => v == null ? "—" : v >= 1000 ? (v / 1000).toFixed(1) + "B" : v.toFixed(0) + "M";

  const buckets = Object.keys(BUCKET).filter(b => (D.pool || []).some(r => r.bucket === b));
  return demoBanner() + `<section class="sec"><div class="sec-h"><h2>ETF 池</h2><span class="muted">候选 ${D.meta.n_etfs} 只 · 参与计算 ${D.meta.n_selected} 只 · 规则：每类按 60 日成交额中位数取 Top ${D.meta.top_n}，另加节点覆盖、配对补全与杠杆块</span></div>
    <div class="seg wrap" role="group" aria-label="类别"><button data-pool="ALL" aria-pressed="${poolBucket === "ALL"}">全部</button>${buckets.map(b => `<button data-pool="${b}" aria-pressed="${poolBucket === b}">${BUCKET[b]}</button>`).join("")}</div>
    <div class="panel tbl-wrap" style="padding:0"><table><thead><tr><th>类别</th><th class="r">排名</th><th>ETF</th><th>名称</th><th class="r">日均成交额</th><th>状态</th><th>节点</th></tr></thead><tbody>
    ${rows.map(r => { const e = E[r.ticker], f = e ? F[e.family] : null; return `<tr${r.selected ? "" : ' class="dimrow"'}><td class="muted">${esc(BUCKET[r.bucket] || r.bucket)}</td><td class="r num">${r.rank}</td><td><b class="mono">${esc(r.ticker)}</b></td><td style="white-space:normal;min-width:180px">${esc(e?.name || "")}</td><td class="r num">${r.available ? dv(r.adv) : "无数据"}</td><td>${r.selected ? `<span class="ok">${esc(REASON[r.reason] || r.reason)}</span>` : `<span class="muted">未入选</span>`}</td><td>${f ? `<button class="linkish" data-node="${esc(f.node)}">${esc(zh(f.node))}</button>` : ""}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
}

function research() {
  const R = D.research;
  if (!R?.all) return `<p class="muted" style="margin-top:20px">还没有研究数据。</p>`;
  const H = R.horizons, rows = resCls === "ALL" ? R.all : R.by_class[resCls] || [];
  const maxAbs = Math.max(0.5, ...rows.flatMap(b => H.map(h => Math.abs(b["f" + h]?.median ?? 0))));
  const block = h => `<div class="panel"><div class="sec-h"><h2>之后 ${h} 个交易日</h2><span class="muted">中位数 · 上涨概率 · 样本天数</span></div>
    ${rows.map(b => { const s = b["f" + h]; const w = s ? Math.abs(s.median) / maxAbs * 50 : 0;
      return `<div class="rbar"><span class="num mono">${b.lo}–${b.hi}°</span>
        <div class="z">${s ? `<b style="left:${s.median >= 0 ? 50 : 50 - w}%;width:${w}%;background:${tcol(bandOf((b.lo + b.hi) / 2))}"></b>` : ""}</div>
        <span class="num" style="text-align:right">${s ? sgn(s.median, 2) + "%" : "样本不足"}</span>
        <span class="num muted" style="text-align:right">${s ? s.hit + "%" : ""}</span>
        <span class="num muted mono" style="text-align:right">${s ? s.n.toLocaleString() : b.days}</span></div>`; }).join("")}</div>`;
  const cls = Object.keys(R.by_class || {});
  return demoBanner() + `<section class="sec"><div class="sec-h"><h2>温度之后发生了什么</h2><span class="signal-tag">研究层</span></div>
    <p class="prose" style="margin:0">把 ${R.n_nodes} 个方向型节点在 ${R.start} 至 ${R.end} 的每日主温度按区间分组，统计之后的涨跌。按周期资格分开看：逆向用法只对周期型应当成立。相邻交易日的样本高度重叠，有效样本远少于显示的天数；这是历史描述，不是预测。</p>
    <div class="seg wrap" role="group" aria-label="周期资格"><button data-rcls="ALL" aria-pressed="${resCls === "ALL"}">全部</button>${cls.map(c => `<button data-rcls="${c}" aria-pressed="${resCls === c}">${esc(CLS[c] || c)}</button>`).join("")}</div></section>
  <section class="research-grid" style="margin-top:16px">${H.map(block).join("")}</section>`;
}

function method() {
  return `<section class="sec prose"><div class="sec-h"><h2>温度怎么来的</h2></div>
  <p><b>温度看的是“离自己的趋势有多远”，不是“价格有多高”。</b>每个节点先用过去 6 个月和 1 年的对数价格回归画出趋势线。一只稳定上涨的 ETF 贴着自己的趋势线走，温度在中性附近，趋势状态显示“强上升”；只有涨得明显快于自己的趋势（加速冲顶）才会变热，跌穿趋势才会变冷。</p>
  <p>五个维度：偏离趋势（${Math.round((D.meta.weights?.stretch ?? .3) * 100)}%）、动量加速（${Math.round((D.meta.weights?.accel ?? .2) * 100)}%）、拥挤度（${Math.round((D.meta.weights?.crowding ?? .2) * 100)}%，含带方向的成交额和杠杆块）、广度（${Math.round((D.meta.weights?.breadth ?? .15) * 100)}%）、相对强弱偏离（${Math.round((D.meta.weights?.rs ?? .15) * 100)}%）。每个子指标先和自己过去 5 年比，再合成；温度 = 合成值在自身 5 年里的百分位，取 3 日平均。所以 95° 的意思是“比自己过去 5 年 95% 的日子都热”，对任何资产都一样。</p>
  <h3>极端要确认</h3><p>进入极热（≥95）或极冷（≤5）时，检查 6 条：偏离趋势、周线 RSI、动量加速、带方向成交额、杠杆情绪、广度。满足 3 条以上且持续 3 个交易日才标记“确认”。</p>
  <h3>周期资格</h3><p>冷热只对周期性、长期存在的行业有逆向参考价值。每个节点自动做 5 项检验：长期回报为正、有过大跌后收复的周期、自身历史上“冷之后好过热之后”、没有长期跑输上级、不是期货或波动率工具。自动结论带 *，需要你在 <code>data/eligibility.yaml</code> 里复核确认。</p>
  <h3>选哪些 ETF</h3><p>候选池 ${D.meta.n_etfs} 只美股上市 ETF，按类别（宽基、行业、细分行业、主题、杠杆、单股杠杆、债券、商品、国际、加密）用 60 日成交额中位数排名，每类取 Top ${D.meta.top_n}；另外保证每个节点保留流动性最好的核心 ETF，并把节点上成交额 ≥500 万美元的杠杆/反向 ETF 纳入杠杆块。今天参与计算 ${D.meta.n_selected} 只。约 ${D.meta.n_stocks} 只大市值股只用于广度和上市前回填，不单独显示。</p>
  <h3>同一个指数只算一次</h3><p>SOXX、SOXL、SOXS 跟踪同一个半导体指数，价格只取核心 ETF；杠杆与反向 ETF（包括 NVDL 这类单股杠杆）只进入杠杆块，按标的映射到节点。正股按行业归属进入广度。</p>
  <h3>元数据核验</h3><p>${D.meta.n_verified}/${D.meta.n_etfs} 只已对照基金官网人工核验。杠杆与反向 ETF 只有在日收益对标的的回归 β 接近目标倍数（±15%）且 R² ≥ 0.85 时才计入。</p>
  <h3>温度不是信号</h3><p>温度描述市场状态；参考动作与风险偏好属于解读层，是历史统计的描述，不是投资建议。</p>
  <p class="muted">模式：${D.meta.mode === "DEMO" ? "演示（模拟行情）" : "真实 EOD 行情"} · 来源：${esc(D.meta.source)} · 截至 ${D.meta.asof} · 生成于 ${D.meta.generated_at}${D.meta.missing?.length ? ` · 未取到数据：${esc(D.meta.missing.join("、"))}` : ""}</p>
  </section>`;
}

function render() {
  let h;
  if (view === "node" && current && N[current]) h = nodeView(current);
  else if (view === "rotation") h = rotation();
  else if (view === "tree") h = tree();
  else if (view === "pool") h = pool();
  else if (view === "research") h = research();
  else if (view === "method") h = method();
  else h = overview();
  app.innerHTML = h + `<footer class="foot"><span>ETF 市场温度计 · 温度描述市场状态，不构成投资建议。</span><span class="mono">${D.meta.n_selected ?? D.meta.n_etfs} ETFs · ${D.meta.n_nodes} nodes · as of ${D.meta.asof}</span></footer>`;
  if (view === "node" && N[current]?.hist) attachHist(histChart(current));
}
go("overview");
})();
</script>
<!--APP-END-->
</body>
</html>
