name: Daily temperature

# Pulls real EOD data after the US close, recomputes temperatures and commits
# site/data.js. A second job publishes site/ to GitHub Pages when Pages is enabled
# (Settings → Pages → Source: GitHub Actions; private repos need a paid plan).
on:
  schedule:
    - cron: "40 22 * * 1-5"   # 22:40 UTC, after the 16:00 ET close
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-temperature
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Build temperatures from real data
        run: PYTHONPATH=src python -m etf_temperature.build --source yahoo
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.js data/snapshots/latest.json
          git diff --cached --quiet || git commit -m "data: daily temperature $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # data is already committed even if Pages is not enabled yet
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
