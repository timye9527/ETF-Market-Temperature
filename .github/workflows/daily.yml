name: Daily temperature

# Pulls real EOD data after the US close, recomputes temperatures, commits
# site/data.js to main and publishes site/ to the gh-pages branch (GitHub Pages).
on:
  schedule:
    - cron: "40 22 * * 1-5"   # 22:40 UTC, after the 16:00 ET close
  workflow_dispatch:
  push:                       # also recompute whenever code or the universe changes
    branches: [main]
    paths-ignore:
      - "site/data.js"
      - "data/snapshots/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: daily-temperature
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Build temperatures from real data
        run: PYTHONPATH=src python -m etf_temperature.build --source yahoo
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.js data/snapshots/latest.json
          git diff --cached --quiet || git commit -m "data: daily temperature $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish site to gh-pages (GitHub Pages)
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "deploy: $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
