<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETF 市场温度计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
</head>
<body>
<!--APP-START-->
<style>
/* Layout: weather-station bulletin — a ruled board of instrument readings, summary first, detail on demand. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eaeef2;
  --ink: #11161d; --ink-2: #47505d; --ink-3: #737d8b; --line: #d9dfe6;
  --accent: #1d4f91; --focus: #1d4f91;
  --t0: #1c5cab; --t1: #2a78d6; --t2: #86b6ef; --t3: #c6c7c1; --t4: #f0a088; --t5: #e34948; --t6: #a51f1f;
  --demo-bg: #fff4d6; --demo-ink: #6b4a00; --demo-line: #ecc766;
  --good: #0c7d0c; --bad: #c43535;
  --f-display: "Barlow Condensed", "Arial Narrow", "Noto Sans SC", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1114; --surface: #161a1f; --surface-2: #1e242b;
  --ink: #edf0f3; --ink-2: #b3bbc6; --ink-3: #848e9b; --line: #2b323a;
  --accent: #8db3ea; --focus: #8db3ea;
  --t0: #4b8ae0; --t1: #3987e5; --t2: #6d9cd6; --t3: #4b4b47; --t4: #d98269; --t5: #e66767; --t6: #f28b80;
  --demo-bg: #2e2510; --demo-ink: #f3d68a; --demo-line: #6b5520;
  --good: #4cc44c; --bad: #ef7a7a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1114; --surface: #161a1f; --surface-2: #1e242b;
  --ink: #edf0f3; --ink-2: #b3bbc6; --ink-3: #848e9b; --line: #2b323a;
  --accent: #8db3ea; --focus: #8db3ea;
  --t0: #4b8ae0; --t1: #3987e5; --t2: #6d9cd6; --t3: #4b4b47; --t4: #d98269; --t5: #e66767; --t6: #f28b80;
  --demo-bg: #2e2510; --demo-ink: #f3d68a; --demo-line: #6b5520;
  --good: #4cc44c; --bad: #ef7a7a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--f-body); margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--ink-3); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font: 700 22px/1 var(--f-display); letter-spacing: .02em; }
.brand span { font: 500 12px var(--f-mono); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { border: 0; background: none; padding: 6px 12px; border-radius: var(--r); cursor: pointer; color: var(--ink-2); }
nav button[aria-current="true"] { background: var(--surface-2); color: var(--ink); font-weight: 500; }
nav button:hover { color: var(--ink); }
.asof { font: 12px var(--f-mono); color: var(--ink-3); }

.demo { margin-top: 16px; border: 1px solid var(--demo-line); background: var(--demo-bg); color: var(--demo-ink); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
.demo b { font-weight: 700; }

/* section headings */
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.sec { margin-top: 28px; display: grid; gap: 12px; }
.sec-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.sec-h h2 { font: 600 20px/1.2 var(--f-display); letter-spacing: .02em; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.reading { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.big { font: 700 84px/0.85 var(--f-display); letter-spacing: -.01em; }
.big sup { font-size: .38em; vertical-align: top; position: relative; top: .25em; margin-left: 2px; color: var(--ink-3); }
.reading-meta { display: grid; gap: 4px; padding-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--c, var(--t3)); }
.delta.up { color: var(--bad); } .delta.down { color: var(--t1); }
.delta { font: 500 12px var(--f-mono); }
.hero-spark svg { display: block; width: 100%; height: 56px; margin-top: 12px; }
.hero-note { color: var(--ink-2); font-size: 13px; margin-top: 10px; max-width: 60ch; }

.gauge-row { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; margin-top: 12px; }
.gauge-row .lbl { font-size: 12px; color: var(--ink-2); }
.minibar { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; }
.minibar b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ink-3); }
.signal-tag { font: 500 11px var(--f-mono); letter-spacing: .08em; color: var(--accent); border: 1px solid var(--accent); padding: 1px 6px; border-radius: 3px; }

/* board */
.board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 0; min-width: 0; }
.group h3 { font: 600 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); padding: 8px 16px 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(70px, 1fr) 48px 52px 74px; align-items: center; gap: 10px; padding: 7px 16px; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; border-top: 1px solid var(--line); }
.row:hover { background: var(--surface-2); }
.row .nm { min-width: 0; }
.row .nm b { display: block; font-weight: 500; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .nm span { display: block; font: 11px var(--f-mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t { font: 700 26px/1 var(--f-display); text-align: right; }
.row .t.na { font: 500 12px var(--f-body); color: var(--ink-3); }
.row .delta { text-align: right; }
.row svg { display: block; width: 100%; height: 26px; }
.row.disabled { cursor: default; } .row.disabled:hover { background: none; }

/* thermometer track */
.track { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--t0) 0 15%, var(--t1) 15% 35%, var(--t2) 35% 45%, var(--t3) 45% 55%, var(--t4) 55% 65%, var(--t5) 65% 85%, var(--t6) 85% 100%); opacity: .9; }
.track .mk { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.track.empty { background: var(--surface-2); }

/* rotation */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 12px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.chart-box { overflow-x: auto; }
.chart-box svg text { fill: var(--ink-2); font: 11px var(--f-body); }
.chart-box svg .ax { stroke: var(--line); }
.heat { display: grid; gap: 2px; min-width: 640px; }
.heat .hr { display: grid; grid-template-columns: 120px repeat(var(--cols), minmax(0, 1fr)) 40px; gap: 1px; align-items: center; }
.heat .hl { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; border: 0; background: none; text-align: left; cursor: pointer; }
.heat .hc { height: 18px; }
.heat .hv { font: 700 15px var(--f-display); text-align: right; }
.heat .hx { font: 10.5px var(--f-mono); color: var(--ink-3); }
.rbar { display: grid; grid-template-columns: 70px minmax(0, 1fr) 64px 56px 64px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.rbar .z { position: relative; height: 14px; }
.rbar .z::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.rbar .z b { position: absolute; top: 2px; height: 10px; border-radius: 2px; }
.chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.chain .lnk { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 12px; min-width: 120px; cursor: pointer; text-align: left; }
.chain .arrow { align-self: center; color: var(--ink-3); font-family: var(--f-mono); }
.chain .lnk b { font: 700 24px/1 var(--f-display); }

/* tree */
.tree { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 0; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 110px 44px 52px; gap: 10px; align-items: center; padding: 5px 16px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.trow:hover { background: var(--surface-2); }
.trow .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.dim .nm { color: var(--ink-3); font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.trow .t { font: 700 18px/1 var(--f-display); text-align: right; }

/* detail */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; color: var(--ink-3); margin-top: 20px; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.detail-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; margin-top: 8px; }
.detail-head h1 { font: 700 40px/1.05 var(--f-display); letter-spacing: .01em; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.factor { display: grid; grid-template-columns: 130px minmax(0, 1fr) 40px; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.factor:first-of-type { border-top: 0; }
.factor .fn b { display: block; font-weight: 500; }
.factor .fn span { font-size: 11px; color: var(--ink-3); }
.factor .v { font: 700 22px/1 var(--f-display); text-align: right; }
.factor .sub { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-3); }
.factor .sub em { font-style: normal; color: var(--ink-2); font-family: var(--f-mono); }
.factor.na .v { font: 500 12px var(--f-body); color: var(--ink-3); }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; }
.bar b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); opacity: .5; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.r, th.r { text-align: right; }
tr.fam td { background: var(--surface-2); font-weight: 500; white-space: normal; }
.role { font: 500 10.5px var(--f-mono); letter-spacing: .04em; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); }
.ok { color: var(--good); } .warn { color: var(--bad); }

.hist-ctl { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.histsvg { width: 100%; height: 240px; display: block; }
.histsvg text { fill: var(--ink-3); font: 10.5px var(--f-mono); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); white-space: nowrap; z-index: 9; }
.rel { position: relative; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.prose { max-width: 70ch; color: var(--ink-2); display: grid; gap: 10px; }
.prose h3 { color: var(--ink); font: 600 17px var(--f-display); letter-spacing: .03em; margin-top: 8px; }
.prose code { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.foot { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 12px; color: var(--ink-3); display: grid; gap: 4px; }

@media (max-width: 860px) {
  .hero, .board, .two { grid-template-columns: minmax(0, 1fr); }
  .big { font-size: 68px; }
}
@media (max-width: 520px) {
  .row { grid-template-columns: minmax(0, 1fr) 44px 48px; }
  .row .trk, .row .spark { display: none; }
  .trow { grid-template-columns: minmax(0, 1fr) 40px 48px; }
  .trow .trk { display: none; }
  .factor { grid-template-columns: 96px minmax(0, 1fr) 36px; }
  .detail-head { grid-template-columns: minmax(0, 1fr); }
  .detail-head h1 { font-size: 32px; }
}
@media (prefers-reduced-motion: no-preference) { .track .mk { transition: left .4s ease; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>ETF 市场温度计</b><span>Market Temperature</span></div>
    <nav id="nav" aria-label="页面">
      <button data-view="overview">总览</button>
      <button data-view="rotation">资金轮动</button>
      <button data-view="tree">市场树</button>
      <button data-view="research">研究</button>
      <button data-view="method">方法</button>
    </nav>
    <span class="asof" id="asof"></span>
  </div>
</header>

<main class="wrap" id="app"></main>

<script src="data.js"></script>
<script>

function spark(vals, w = 90, h = 26) {
  const v = vals.map((x, i) => [i, x]).filter(p => p[1] != null);
  if (v.length < 2) return "";
  const n = vals.length - 1, x = i => i / n * (w - 4) + 2, y = t => h - 3 - t / 100 * (h - 6);
  const d = v.map((p, k) => (k ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
  const last = v[v.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${y(50)}" y2="${y(50)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="2.6" fill="${tcol(bandOf(last[1]))}" stroke="var(--surface)" stroke-width="1"/></svg>`;
}

    "EQUITY/US/SECTOR/INFORMATION_TECHNOLOGY/SEMICONDUCTORS", "EQUITY/US/SECTOR/INFORMATION_TECHNOLOGY/SOFTWARE",

  const C = 60, hd = D.dates.slice(-C);
  const heat = `<div class="heat" style="--cols:${C}">${HEAT.map(id => {
    const h = N[id].hist.slice(-C);
    return `<div class="hr"><button class="hl" data-node="${esc(id)}">${esc(zh(id))}</button>${h.map((v, i) =>

  }).join("")}<div class="hr"><span></span>${hd.map((d, i) => `<span class="hx">${i % 20 === 0 ? d.slice(5) : ""}</span>`).join("")}<span></span></div></div>`;

function histChart(id) {
  const n = N[id], vals = n.hist.slice(-histRange), dates = D.dates.slice(-histRange);
  const W = 640, H = 240, l = 30, r = 10, t = 10, b = 24, iw = W - l - r, ih = H - t - b;
  const x = i => l + i / (vals.length - 1) * iw, y = v => t + (1 - v / 100) * ih;
  let s = `<svg class="histsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(zh(id))} 温度历史">`;
  const edges = [0, ...D.meta.bands.map(b => Math.min(b.max, 100))];
  D.meta.bands.forEach((bd, i) => s += `<rect x="${l}" width="${iw}" y="${y(edges[i + 1])}" height="${y(edges[i]) - y(edges[i + 1])}" fill="var(--t${i})" opacity=".09"/>`);
  for (const g of [0, 15, 35, 50, 65, 85, 100]) s += `<line x1="${l}" x2="${W - r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${l - 6}" y="${y(g) + 3}" text-anchor="end">${g}</text>`;
  const ticks = 4;
  for (let k = 0; k <= ticks; k++) { const i = Math.round(k / ticks * (vals.length - 1)); s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === ticks ? "end" : "middle"}">${dates[i].slice(2)}</text>`; }
  let d = "", pen = false;
  vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
  s += `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  const li = vals.length - 1;
  if (vals[li] != null) s += `<circle cx="${x(li)}" cy="${y(vals[li])}" r="4" fill="${tcol(n.band)}" stroke="var(--surface)" stroke-width="2"/>`;
  s += `<line id="hx" x1="0" x2="0" y1="${t}" y2="${t + ih}" stroke="var(--ink-3)" stroke-dasharray="3 3" visibility="hidden"/><rect id="hz" x="${l}" y="${t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  return { svg: s, vals, dates, l, iw, W };
}

function attachHist(h) {
  const box = document.getElementById("histbox"); if (!box) return;
  const svg = box.querySelector("svg"), tip = document.getElementById("htip"), hx = svg.querySelector("#hx");
  const move = ev => {
    const rect = svg.getBoundingClientRect(), px = (ev.clientX - rect.left) / rect.width * h.W;
    const i = Math.max(0, Math.min(h.vals.length - 1, Math.round((px - h.l) / h.iw * (h.vals.length - 1))));
    const v = h.vals[i]; if (v == null) { tip.hidden = true; return; }
    const sx = h.l + i / (h.vals.length - 1) * h.iw;
    hx.setAttribute("x1", sx); hx.setAttribute("x2", sx); hx.setAttribute("visibility", "visible");
    tip.hidden = false; tip.innerHTML = `<span class="mono">${h.dates[i]}</span><br><b class="num">${fmt(v)}°</b> ${BAND[bandOf(v)][0]}`;
    const left = sx / h.W * rect.width; tip.style.left = Math.min(rect.width - 110, Math.max(0, left + 10)) + "px"; tip.style.top = "8px";
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; hx.setAttribute("visibility", "hidden"); });
}

    return `<div class="factor${v == null ? " na" : ""}"><div class="fn"><b>${name}</b><span>${desc}</span></div>
      <div class="bar">${v == null ? "" : `<b style="width:${v}%;background:${tcol(bandOf(v))}"></b>`}</div>
      <div class="v num">${v == null ? "不适用" : fmt(v)}</div>
      ${subs.length || extra.length ? `<div class="sub">${[...extra.map(([, x]) => `活跃度(无方向) <em>${fmt(x)}</em>`), ...subs.map(([s, x]) => `${SUB[s] || s} <em>${s === "bull_share_raw" ? fmt(x * 100, 0) + "%" : s === "volume_z" ? fmt(x, 2) : fmt(x)}</em>`)].join("")}</div>` : ""}</div>`;
  }).join("");
  const why = {
    bullbear: "该节点没有经过校验的杠杆/反向 ETF。",
    rs: "该节点没有设定相对强弱基准。",
    breadth: "广度只对有 5 个以上子板块的节点计算。",
  };
  const missing = FACT.filter(([k]) => n.factors?.[k] == null).map(([k, name]) => `${name.split(" ")[0]}：${why[k] || "数据不足。"}`);
  return demoBanner() + `
  <nav class="crumbs" aria-label="层级">${crumbs.map((c, i) => `${i ? "<span>›</span>" : ""}<button data-node="${esc(c)}">${esc(zh(c))}</button>`).join("")}</nav>
  <div class="detail-head"><div><h1>${esc(zh(id))}</h1><div class="muted mono" style="overflow-wrap:anywhere">${esc(en(id))} · ${esc(id)}</div>
    <div class="facts">${chip(n.band)}${n.temp != null ? `<span class="chip">置信度 ${n.confidence} · ${n.coverage}/5 因子</span><span class="chip">活跃度 ${fmt(n.activity)}</span>` : ""}${n.mode === "REFERENCE" ? `<span class="chip">参照节点：不表示“热门”</span>` : ""}${n.rs_benchmark ? `<button class="chip" data-node="${esc(n.rs_benchmark)}" style="border:0;cursor:pointer">RS 基准：${esc(zh(n.rs_benchmark))}</button>` : ""}</div></div>
    <div class="reading"><div class="big num">${n.temp == null ? "—" : fmt(n.temp)}<sup>°</sup></div>
      <div class="reading-meta"><span class="delta num ${deltaCls(n.d1)}">1 日 ${sgn(n.d1)}</span><span class="delta num ${deltaCls(n.d5)}">5 日 ${sgn(n.d5)}</span><span class="delta num ${deltaCls(n.d20)}">20 日 ${sgn(n.d20)}</span></div></div></div>
  ${n.status === "NO_COVERAGE" ? `<div class="panel" style="margin-top:16px">${esc(n.note)}</div>` : ""}
  ${n.note && n.status !== "NO_COVERAGE" ? `<p class="muted" style="margin-top:10px">${esc(n.note)}</p>` : ""}
  ${n.temp == null ? "" : `<section class="two" style="margin-top:18px">
    <div class="panel"><div class="sec-h"><h2>因子拆解</h2><span class="muted">温度 = 可用因子的等权平均</span></div>${factorHtml}
      ${missing.length ? `<p class="muted" style="font-size:12px;margin:8px 0 0">${missing.map(esc).join("<br>")}</p>` : ""}</div>
    <div class="panel"><div class="hist-ctl"><h2 style="font:600 20px var(--f-display)">温度历史</h2>
      <div class="seg" role="group" aria-label="时间范围">${[[21, "1M"], [63, "3M"], [126, "6M"], [252, "1Y"]].map(([k, l]) => `<button data-range="${k}" aria-pressed="${histRange === k}">${l}</button>`).join("")}</div></div>
      <div class="rel" id="histbox">${h.svg}<div class="tip" id="htip" hidden></div></div>
      <p class="muted" style="font-size:12px;margin:6px 0 0">背景色带 = 温度区间（暂定，待历史校准）。</p></div></section>`}
  ${kids.length ? `<section class="sec"><div class="sec-h"><h2>下一级</h2></div><div class="group">${kids.map(row).join("")}</div></section>` : ""}
  ${fids.length ? `<section class="sec"><div class="sec-h"><h2>ETF Family</h2><span class="muted">${n.families.length ? "" : "本节点由代表 Family 提供价格 · "}同一 Family 内只取核心 ETF 的价格；杠杆/反向只进入多空因子</span></div>
    <div class="panel tbl-wrap" style="padding:0"><table><thead><tr><th>ETF</th><th>角色</th><th class="r">杠杆</th><th class="r">层级</th><th class="r">5日</th><th class="r">20日</th><th class="r">日均成交额</th><th>元数据核验</th></tr></thead>
    <tbody>${fids.map(etfRows).join("")}</tbody></table></div></section>` : ""}`;
}

function research() {
  const R = D.research;
  if (!R) return `<p class="muted" style="margin-top:20px">还没有研究数据。</p>`;
  const H = R.horizons;
  const maxAbs = Math.max(0.5, ...R.buckets.flatMap(b => H.map(h => Math.abs(b["f" + h]?.mean ?? 0))));
  const block = h => `<div class="panel"><div class="sec-h"><h2>之后 ${h} 个交易日</h2><span class="muted">平均涨跌 · 上涨概率 · 样本天数</span></div>
    ${R.buckets.map(b => { const s = b["f" + h]; const w = s ? Math.abs(s.mean) / maxAbs * 50 : 0;
      return `<div class="rbar"><span class="num mono">${b.lo}–${b.hi}°</span>
        <div class="z">${s ? `<b style="left:${s.mean >= 0 ? 50 : 50 - w}%;width:${w}%;background:${tcol(bandOf((b.lo + b.hi) / 2))}"></b>` : ""}</div>
        <span class="num r" style="text-align:right">${s ? sgn(s.mean, 2) + "%" : "样本不足"}</span>
        <span class="num muted" style="text-align:right">${s ? s.hit + "%" : ""}</span>
        <span class="num muted mono" style="text-align:right">${s ? s.n.toLocaleString() : b.days}</span></div>`; }).join("")}</div>`;
  const share = D.meta.bands.map((b, i) => `<span class="chip" style="--c:var(--t${i})"><i></i>${BAND[b.code][0]} ${R.band_share[b.code]}%</span>`).join("");
  return demoBanner() + `<section class="sec"><div class="sec-h"><h2>温度之后发生了什么</h2><span class="signal-tag">研究层 RESEARCH</span></div>
    <p class="prose" style="margin:0">把 ${R.n_nodes} 个方向型节点在 ${R.start} 至 ${R.end} 的每日温度按 10° 分组，统计各组之后的价格涨跌。这是历史描述，不是预测：相邻交易日的样本高度重叠，有效样本远少于显示的天数；不同资产被混在一起统计。</p></section>
  <section class="two" style="margin-top:16px">${H.map(block).join("")}</section>
  <section class="sec"><div class="sec-h"><h2>温度区间实际出现的频率</h2><span class="muted">用于校准区间阈值</span></div>
    <div class="legend">${share}</div>
    <p class="muted" style="font-size:12.5px;margin:0">如果“极热”“极冷”出现得太少或太多，说明区间阈值需要按历史分布重新划分（待办 Q6）。</p></section>`;
}

function method() {
  return `<section class="sec prose"><div class="sec-h"><h2>温度怎么来的</h2></div>
  <p>每个市场节点（例如“半导体”）都由跟踪它的 ETF 读数合成一个 0–100 的温度，取最近 3 个交易日的平均，避免单日噪音。每个读数都和该资产<b>自己过去一年</b>的历史比较，所以 80° 的意思是“比它自己一年里大多数时候都热”，不同资产之间的温度不代表同一种风险。</p>
  <h3>五个因子</h3>
  <p><b>趋势</b>：价格相对 20/50/200 日均线的位置、5/20/60 日动量、在 52 周区间中的位置。<b>成交</b>：5 日平均美元成交额在一年中的分位；放量上涨加温，放量下跌降温，缩量接近中性。无方向的“活跃度”单独显示，用来区分“冷且恐慌”和“冷且无人问津”。<b>多空杠杆</b>：杠杆多头与空头 ETF 的成交额，按杠杆倍数折算成敞口后比较。<b>相对强弱</b>：相对上一级基准（例如半导体对科技、科技对美股）。<b>广度</b>：子板块中站上均线、20 日上涨、创新高的比例，只对有 5 个以上子板块的节点计算。</p>
  <h3>同一个指数只算一次</h3>
  <p>SOXX、SOXL、SOXS 跟踪同一个半导体指数，是同一件事的三种包装，不是三票。价格只取核心 ETF；替代核心 ETF 只贡献成交额；杠杆与反向 ETF 只进入多空因子。指数不同的 ETF（例如 SMH）是另一个 Family，挂在同一个节点下。</p>
  <h3>元数据核验</h3>
  <p>${D.meta.n_verified}/${D.meta.n_etfs} 只 ETF 已对照基金官网人工核验。杠杆与反向 ETF 在人工核验前，只有当其日收益与核心 ETF 的回归 β 接近目标倍数（±15%）且 R² ≥ 0.85 时才进入多空因子。</p>
  <h3>温度区间（暂定）</h3>
  <div class="legend">${D.meta.bands.map((b, i) => `<span class="chip" style="--c:var(--t${i})"><i></i>${BAND[b.code][0]} ${BAND[b.code][1]} ${i ? D.meta.bands[i - 1].max : 0}–${Math.min(b.max, 100)}</span>`).join("")}</div>
  <p>多个分位数平均后会向 50 集中，所以这些区间需要用多年历史温度分布重新校准。</p>
  <h3>温度不是信号</h3>
  <p>温度描述市场状态，不是买入或卖出建议，也不预测涨跌。“风险偏好”面板属于解读层，与温度分开计算和展示。</p>
  <h3>数据</h3>
  <p>模式：${D.meta.mode === "DEMO" ? "演示（模拟行情）" : "真实 EOD 行情"} · 来源：${esc(D.meta.source)} · 截至 ${D.meta.asof} · 生成于 ${D.meta.generated_at} · 分位窗口 ${D.meta.window} 个交易日。</p>
  </section>`;
}

function render() {
  let h;
  if (view === "node" && current && N[current]) h = nodeView(current);
  else if (view === "rotation") h = rotation();
  else if (view === "tree") h = tree();
  else if (view === "research") h = research();
  else if (view === "method") h = method();
  else h = overview();
  app.innerHTML = h + `<footer class="foot"><span>ETF 市场温度计 · 温度描述市场状态，不构成投资建议。</span><span class="mono">${D.meta.n_etfs} ETFs · ${D.meta.n_families} families · ${D.meta.n_nodes} nodes · as of ${D.meta.asof}</span></footer>`;
  if (view === "node" && N[current]?.hist) attachHist(histChart(current));
}
go("overview");
})();
</script>
<!--APP-END-->
</body>
</html>
